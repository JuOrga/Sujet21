# LE DÉPLOIEMENT — groupé, et seulement depuis prod.
#
# CE QU'ON PAYAIT. Chaque poussée sur la branche de développement partait
# en PRODUCTION sur sujet21.vercel.app. Mesuré au 31/08 : 474 déploiements
# en 23 jours, soit ~618 par mois — dont des commits qui ne touchaient que
# `docs/`. C'était le principal poste Vercel, et 474 minutes d'Actions.
#
# DÉSORMAIS on livre par lots : le travail s'accumule sur `dev`, et c'est
# la fusion `dev` → `prod` qui publie. Une livraison = un déploiement, au
# moment choisi, au lieu d'un déploiement par commit.
#
# LE SITE DE TEST N'EST PAS PERDU pour autant : « Run workflow » déploie
# n'importe quelle branche à la demande, et le choix `cible` permet une
# PRÉVISUALISATION (URL séparée) qui ne touche pas au site en ligne. On
# déploie donc quand on veut voir, pas à chaque commit.
#
# DEUX CHAÎNES PARTENT D'UNE POUSSÉE — et une seule est écrite ici.
#
# Celle-ci : GitHub démarre un runner, la CLI Vercel ENVOIE LES SOURCES
# (sans --prebuilt, elle ne construit rien elle-même) et Vercel compile sur
# ses machines. Le runner passe l'essentiel de sa minute à attendre. Une
# livraison coûte donc les deux : ~57 s d'Actions ET une construction Vercel.
#
# L'AUTRE, invisible depuis le dépôt : l'application GitHub de Vercel est
# CONNECTÉE au projet et reçoit le même webhook. Mesuré le 31/08 : elle
# créait son déploiement 3 s après la poussée — avant même que le runner
# n'ait démarré — et elle le faisait sur TOUTES les branches. Sur une heure :
# 20 déploiements, dont 2 seulement en production ; les 18 autres étaient des
# aperçus que personne n'ouvre, y compris sur `sauvegardes` qui ne contient
# que du JSON et échouait à chaque fois.
#
# CE QUI LA RETIENT AUJOURD'HUI n'est pas dans ce fichier : c'est le réglage
# « Ignored Build Step » du projet Vercel, passé à « Don't build anything ».
# Le remettre sur « Automatic » ramènerait le doublon EN SILENCE — aucune
# ligne du dépôt ne le dirait. C'est écrit ici faute de pouvoir l'écrire
# là-bas.
#
# Déploiement en CLI avec token (secrets VERCEL_*) : c'est ce workflow, et
# lui seul, qui publie.
name: deploy

on:
  push:
    # `prod` PUBLIE. `previsu-go` est la GÂCHETTE de prévisualisation : y
    # pousser n'importe quelle branche en déploie un aperçu, sans jamais
    # toucher au site en ligne. Tous les autres workflows du dépôt ont la
    # leur (sauvegarde-go, perf-sync-go, diag-*-go, seed-*-go) ; `deploy`
    # était le seul à n'en avoir pas, et il fallait donc trouver le bouton
    # « Run workflow » — qui ne s'affiche pas toujours selon l'appareil et
    # la largeur de la fenêtre. Une gâchette, elle, marche partout :
    #
    #   git push -f origin <votre-branche>:previsu-go
    #
    branches: [prod, previsu-go]
    # Ce qui ne part pas dans le site ne mérite pas un déploiement. À savoir
    # pour la gâchette : le filtre vaut pour elle aussi. Une poussée sur
    # previsu-go qui ne changerait QUE de la documentation ne déclenche rien
    # — et rien ne le dit. On y pousse une branche de travail entière, donc
    # le cas est rare ; s'il arrive, c'est ici qu'il faut revenir.
    paths-ignore:
      - 'docs/**'
      - 'masters/**'
      - 'ops/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      cible:
        description: 'production = sujet21.vercel.app · previsualisation = URL séparée, le site en ligne n’est pas touché'
        type: choice
        default: previsualisation
        options: [previsualisation, production]

# LA CONCURRENCE EST PAR BRANCHE, ET C'EST VITAL DEPUIS LA GÂCHETTE. Un
# groupe unique annulait l'exécution en cours : une prévisualisation poussée
# pendant une mise en ligne aurait TUÉ la mise en ligne, laissant le site sur
# la version d'avant, en silence. Chaque branche a donc sa file — trois
# poussées d'affilée sur previsu-go ne construisent toujours qu'une fois,
# mais elles ne touchent plus à ce que fait prod.
concurrency:
  group: vercel-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # CLI épinglée : vercel@59.7.0 est sorti avec une dépendance
      # introuvable (@vercel/container@3.0.2, ETARGET) — 59.6.2 est saine.
      #
      # PUBLIER EST L'EXCEPTION, PAS LE DÉFAUT. La règle était écrite à
      # l'envers : tout ce qui n'était pas un lancement manuel demandant
      # une prévisualisation partait en PRODUCTION. Ça tenait tant que
      # `prod` était la seule branche déclenchante ; avec une gâchette de
      # plus, la même règle aurait publié à sa première poussée. On nomme
      # donc les DEUX cas qui publient — une poussée sur `prod`, un
      # lancement manuel ciblant `production` — et tout le reste est un
      # aperçu. Une branche ajoutée par mégarde ne peut plus mettre en
      # ligne : elle ne peut que faire un aperçu de trop.
      #
      # L'URL EST REMONTÉE EN TÊTE DE L'EXÉCUTION. Une prévisualisation
      # reçoit une adresse NEUVE à chaque fois (sujet21-<hash>.vercel.app) :
      # la laisser au fond des logs obligerait à la pêcher à la main avant
      # de pouvoir ouvrir le jeu sur un téléphone. La CLI écrit l'URL sur sa
      # sortie standard — on la capture, et elle s'affiche en gros, cliquable,
      # dans le résumé de l'exécution.
      - name: Déployer
        run: |
          set -euo pipefail
          publie=non
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ github.ref_name }}" = "prod" ]; then
            publie=oui
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.cible }}" = "production" ]; then
            publie=oui
          fi
          if [ "$publie" = "oui" ]; then
            quoi='PRODUCTION'
            note='Le site en ligne a été remplacé.'
            url=$(npx vercel@59.6.2 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          else
            quoi='PRÉVISUALISATION'
            note='Adresse jetable — le site en ligne n’est pas touché.'
            url=$(npx vercel@59.6.2 deploy --yes --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          fi
          echo "$quoi → $url"
          {
            echo "## $quoi"
            echo
            echo "### 👉 [$url]($url)"
            echo
            echo "$note"
            echo
            echo "Branche déployée : \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
