# Diagnostic ponctuel : lire la bibliothèque partagée (/api/levels) depuis
# CI — l'agent de développement n'a pas d'accès réseau direct au site.
name: diag-levels
on:
  workflow_dispatch:
  push:
    branches: [diag-levels-go]

jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la bibliothèque
        run: |
          echo "== /api/levels =="
          curl -sS "https://sujet21.vercel.app/api/levels" -o reponse.json -w "HTTP %{http_code}\n" || true
          echo "== taille =="
          wc -c reponse.json || true
          echo "== corps brut (début) =="
          head -c 600 reponse.json; echo
          echo "== /api/levels?debug=1 (état du magasin) =="
          curl -sS "https://sujet21.vercel.app/api/levels?debug=1" -o debug.json -w "HTTP %{http_code}\n" || true
          python3 - <<'EOF'
          import json
          try:
            d = json.load(open('debug.json'))
            print('nb blobs :', d.get('nb'))
            for b in d.get('etat', []):
              print('-', b.get('pathname'), '|', b.get('taille'), 'o |', b.get('uploadedAt'), '| HTTP', b.get('statut'))
              print('  extrait :', (b.get('extrait') or '')[:120])
          except Exception as e:
            print('debug illisible :', e)
          EOF
          echo "== aperçu (ids et noms) =="
          python3 - <<'EOF'
          import json
          try:
            d = json.load(open('reponse.json'))
            if 'error' in d:
              print('ERREUR API :', d.get('error'), '|', d.get('detail'))
            lv = d.get('levels', [])
            print('nb tableaux :', len(lv))
            for l in lv:
              print('-', l.get('id'), '|', (l.get('level') or {}).get('code'), '|', (l.get('level') or {}).get('name'), '| maj', l.get('majAt'))
          except Exception as e:
            print('illisible :', e)
          EOF
          echo "== /api/records =="
          curl -sS "https://sujet21.vercel.app/api/records" -o records.json -w "HTTP %{http_code}\n" || true
          python3 - <<'EOF'
          import json
          try:
            d = json.load(open('records.json'))
            if 'error' in d:
              print('ERREUR API :', d.get('error'), '|', d.get('detail'))
            print('records tableaux :', len(d.get('tableaux') or {}))
            print('tops :', len(d.get('tops') or {}))
            print('expedition :', 'oui' if d.get('expedition') else 'non')
          except Exception as e:
            print('illisible :', e)
          EOF
