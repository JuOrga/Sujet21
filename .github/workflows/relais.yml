# LE RELAIS DU MULTI — déployé à la demande, jamais tout seul.
#
# relais/ est un PROJET VERCEL À PART (sujet21-relais) : le serveur par qui
# passe une partie à deux (relais/index.js dit pourquoi). Il ne change
# presque jamais ; il ne se déploie donc que sur un geste :
#
#   git push -f origin <votre-branche>:relais-go     # la gâchette
#
# LE PIÈGE DE LA PREMIÈRE FOIS : pousser sur une gâchette qui n'existe pas
# encore, avec des commits que le dépôt connaît déjà, ne lance rien —
# GitHub ne voit aucun fichier modifié, et `paths-ignore` écarte l'exécution.
# La gâchette existe désormais ; si on la recrée un jour, la poser d'abord
# sur un commit ancien, puis sur le bon.
#
# ou relais → Run workflow. Aucune poussée sur prod, dev ou une branche de
# travail ne lance ce workflow : il coûte une minute d'Actions par
# déploiement du relais, et rien le reste du temps.
#
# Après le déploiement, l'essai (relais/essai.mjs) joue deux joueurs contre
# le relais EN LIGNE, depuis ce serveur-ci — l'environnement d'analyse ne
# le joint pas. Le résumé de l'exécution dit ce qu'il a vu.

name: relais

on:
  push:
    branches: [relais-go]
    paths-ignore:
      - 'docs/**'
      - 'masters/**'
      - 'ops/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: relais
  cancel-in-progress: true

jobs:
  deploie:
    runs-on: ubuntu-latest
    env:
      PROJET: sujet21-relais
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # LE JETON DU DÉPÔT N'EST PAS CELUI D'UN UTILISATEUR. La première
      # version de cette étape créait le projet par la ligne de commande
      # (`vercel project add`, `vercel link`) : « Not able to load user —
      # User not found (404) ». Le jeton déploie un projet DONT ON LUI DONNE
      # L'IDENTIFIANT (c'est ce que fait deploy.yml), il ne sait pas dire
      # « qui suis-je ». On cherche donc le projet par l'API, on le crée par
      # l'API s'il manque, et on déploie comme le jeu : équipe et projet
      # passés par l'environnement.
      - name: Déployer le relais
        working-directory: relais
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          jeton='${{ secrets.VERCEL_TOKEN }}'
          api='https://api.vercel.com'
          champ() { node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const o=JSON.parse(d);console.log(String(process.argv[1].split(".").reduce((x,k)=>x==null?x:x[k],o)??""))}catch{console.log("")}})' "$1"; }
          rep=$(curl -sS -H "Authorization: Bearer $jeton" "$api/v9/projects/$PROJET?teamId=$VERCEL_ORG_ID")
          id=$(echo "$rep" | champ id)
          if [ -z "$id" ]; then
            echo "le projet $PROJET n'existe pas encore : création"
            rep=$(curl -sS -X POST -H "Authorization: Bearer $jeton" -H 'Content-Type: application/json' \
              "$api/v11/projects?teamId=$VERCEL_ORG_ID" -d "{\"name\":\"$PROJET\",\"framework\":\"express\"}")
            id=$(echo "$rep" | champ id)
            if [ -z "$id" ]; then
              echo "::error::création du projet refusée : $(echo "$rep" | champ error.code) — $(echo "$rep" | champ error.message)"
              exit 1
            fi
          fi
          echo "projet $PROJET trouvé"
          export VERCEL_PROJECT_ID="$id"
          url=$(npx vercel@59.6.2 deploy --prod --yes --token="$jeton" | tail -1)
          echo "déployé → $url"
          echo "URL=$url" >> "$GITHUB_ENV"
          # les domaines du projet : c'est le premier que le jeu doit viser
          domaines=$(curl -sS -H "Authorization: Bearer $jeton" "$api/v9/projects/$id/domains?teamId=$VERCEL_ORG_ID" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log((JSON.parse(d).domains??[]).map(x=>x.name).join(" "))}catch{console.log("")}})')
          echo "domaines : $domaines"
          echo "DOMAINES=$domaines" >> "$GITHUB_ENV"
      - name: Essayer le relais en ligne
        working-directory: relais
        run: |
          set -uo pipefail
          domaine=$(echo "$DOMAINES" | cut -d' ' -f1)
          [ -n "$domaine" ] || domaine=$(echo "$URL" | sed 's#^https://##')
          npm install --no-audit --no-fund >/dev/null 2>&1
          {
            echo "## Le relais"
            echo
            echo "Déploiement : $URL"
            echo
            echo "Domaines : \`$DOMAINES\`"
            echo
            echo '```'
            echo "== pouls de $domaine =="
            curl -sS -m 20 "https://$domaine/" -w "\nHTTP %{http_code}\n" || true
            echo "== essai à deux joueurs =="
            node essai.mjs "wss://$domaine/ws" 8 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
