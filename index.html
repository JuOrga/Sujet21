<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tension de surface — banc de prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04070d;
        color: #cfe6f5;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#glcanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 14px;
        bottom: 12px;
        font-size: 12px;
        line-height: 1.7;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
        white-space: pre;
      }
      #help {
        position: fixed;
        left: 14px;
        top: 12px;
        font-size: 11px;
        opacity: 0.55;
        pointer-events: none;
        white-space: pre;
        line-height: 1.6;
      }
      /* Panneau d'explication du banc de réglage : décrit le réglage survolé */
      .bench-hint {
        padding: 8px 10px;
        font-size: 11px;
        line-height: 1.5;
        color: #a8c4d8;
        background: rgba(8, 14, 22, 0.92);
        border-top: 1px solid rgba(160, 200, 230, 0.15);
        border-radius: 0 0 6px 6px;
        min-height: 2.6em;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(2, 6, 12, 0.55);
        font-size: 22px;
        letter-spacing: 0.14em;
      }
      #overlay.visible {
        display: flex;
      }
      #overlay small {
        font-size: 12px;
        opacity: 0.7;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="glcanvas"></canvas></div>
    <div id="help"></div>
    <div id="hud"></div>
    <div id="overlay">
      <div id="overlay-title">DISPERSION</div>
      <small id="overlay-sub">La cohésion ne tient plus. Appuyez sur R pour recommencer.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
