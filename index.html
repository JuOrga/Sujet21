<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Tension de surface — banc de prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04070d;
        color: #cfe6f5;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas#glcanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 14px;
        bottom: 12px;
        font-size: 12px;
        line-height: 1.7;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
        white-space: pre;
      }
      #help {
        position: fixed;
        left: 14px;
        top: 12px;
        font-size: 11px;
        opacity: 0.55;
        pointer-events: none;
        white-space: pre;
        line-height: 1.6;
      }
      /* Le banc ne doit jamais dépasser l'écran : il défile en interne */
      .tp-dfwv {
        max-height: calc(100dvh - 16px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* Barre de commandes tactiles (pause, time warp, vortex, zoom, restart) */
      #touchbar {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      #touchbar button {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid rgba(160, 200, 230, 0.25);
        border-radius: 8px;
        background: rgba(8, 14, 22, 0.75);
        color: #cfe6f5;
        font-family: inherit;
        font-size: 16px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #touchbar button.active {
        background: rgba(70, 130, 180, 0.55);
        border-color: rgba(160, 200, 230, 0.7);
      }
      @media (max-width: 700px) {
        #help {
          font-size: 9px;
        }
        #hud {
          font-size: 11px;
          bottom: 66px; /* au-dessus de la barre tactile */
        }
      }
      /* Panneau d'explication du banc de réglage : décrit le réglage survolé.
         Masqué quand le banc est replié. */
      .tp-rotv:not(.tp-rotv-expanded) .bench-hint,
      .tp-rotv:not(.tp-rotv-expanded) ~ .bench-hint {
        display: none;
      }
      .bench-hint {
        padding: 8px 10px;
        font-size: 11px;
        line-height: 1.5;
        color: #a8c4d8;
        background: rgba(8, 14, 22, 0.92);
        border-top: 1px solid rgba(160, 200, 230, 0.15);
        border-radius: 0 0 6px 6px;
        min-height: 2.6em;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(2, 6, 12, 0.55);
        font-size: 22px;
        letter-spacing: 0.14em;
      }
      #overlay.visible {
        display: flex;
      }
      #overlay small {
        font-size: 12px;
        opacity: 0.7;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="glcanvas"></canvas></div>
    <div id="help"></div>
    <div id="hud"></div>
    <div id="touchbar"></div>
    <div id="overlay">
      <div id="overlay-title">DISPERSION</div>
      <small id="overlay-sub">La cohésion ne tient plus. Appuyez sur R pour recommencer.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
